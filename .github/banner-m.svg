  .acc { fill: #7c9bff; }
  @keyframes pulse { 0%, 100% { opacity: 1 } 50% { opacity: .3 } }
  @keyframes ping { 0% { transform: scale(1); opacity: .6 } 100% { transform: scale(3); opacity: 0 } }
  @keyframes flow { to { stroke-dashoffset: -16 } }
