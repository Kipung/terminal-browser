<svg xmlns="http://www.w3.org/2000/svg" xmlns:xlink="http://www.w3.org/1999/xlink" width="1000" height="358" viewBox="0 0 1000 358" role="img" aria-label="Terminal Browser Split: A live, clickable browser preview in a native terminal split, opened by you with a hotkey or by any coding agent with one command.">
<style>
