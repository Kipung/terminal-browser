# Ghostty keybind for the terminal-browser addon (macOS + Linux).
# Included from ~/.config/ghostty/config via one line (see install.sh):
#   config-file = <this repo>/configs/ghostty.conf
#
# Flow: split right (Ghostty built-in: cmd+d / super+d), then this keybind
# types the browser command into the focused split. Ghostty 1.3.x cannot
# chain actions onto new_split, so launching is its own keybind — text:
# just types the command + Enter.
#
# "super" is the same modifier as "cmd"/"command" in Ghostty: Command on
# macOS, Super on Linux/Windows. One line, both platforms.
#
# Keep the browser OUTSIDE multiplexer panes (herdr & co): those hosts replay
# their whole graphics scene to the terminal on every text frame, which pins
# CPU when a kitty-graphics pane shares a tab with a streaming agent TUI.
# A native Ghostty split sidesteps that entirely.

keybind = super+shift+n=text:terminal-browser open http://localhost:3000\r
