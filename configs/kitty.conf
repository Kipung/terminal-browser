# kitty keybind for the terminal-browser addon (macOS + Linux, Ctrl on both).
# Included from ~/.config/kitty/kitty.conf via one line (see install.sh):
#   include <this repo>/configs/kitty.conf
#
# One press opens the browser directly in a NEW right split: kitty's `launch`
# runs the command in the split itself, so there is nothing to type (kitty
# CAN chain, unlike Ghostty).
#
# Bonus: inside a multiplexer (herdr/tmux) kitty hotkeys are caught by kitty
# before the multiplexer sees them — so this is also the escape hatch for
# getting a fast native split when the multiplexer path is the slow one.

map ctrl+shift+n launch --location=split --cwd=current terminal-browser open http://localhost:3000
