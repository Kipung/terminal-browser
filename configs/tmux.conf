# tmux keybind for the terminal-browser addon (macOS + Linux).
# Sourced from ~/.tmux.conf via one line (see install.sh):
#   source-file <this repo>/configs/tmux.conf
#
# Usage: <prefix> then n   (default prefix Ctrl+b)
# Opens the browser in a new right split at the current pane's path.
#
# Heads-up: graphics pass-through inside tmux panes is host-dependent. If
# the browser renders broken or slow inside a tmux pane, prefer the HOST
# terminal's own native split — the addon's open-preview.sh does exactly
# that when it detects a multiplexer.

bind n split-window -h -c "#{pane_current_path}" "terminal-browser open http://localhost:3000"
