# Ghostty keybinds from the ghostty-browser-split addon.
# Your main ~/.config/ghostty/config just needs one line (see install.sh):
#   config-file = <this folder>/ghostty.conf
#
# Cmd+D        -> built-in Ghostty split to the right (no config needed here)
# Cmd+Shift+N  -> types the terminal-browser command into the focused split
#
# Keep the browser OUTSIDE multiplexer panes (herdr & co): those hosts replay
# their whole graphics scene to the terminal on every text frame, which pins
# CPU when a kitty-graphics pane shares a tab with a streaming agent TUI.
# A native Ghostty split (Cmd+D) sidesteps that entirely.
#
# Note: Ghostty 1.3.1 cannot chain actions onto new_split, so launching is
# its own keybind. text: just types the command + Enter into the focused pane.
# Change the URL below to your dev server.

keybind = cmd+shift+n=text:terminal-browser open http://localhost:3000\r
